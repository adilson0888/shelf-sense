# Serves the Vite-built static SPA. try_files falls back to index.html so
# client-side routing (any non-file path) still resolves instead of 404ing.
#
# /api/ is reverse-proxied to the api container so the browser only ever
# talks to this same origin — see apps/web/src/lib/api.ts (VITE_API_URL is
# baked in at Vite build time, defaulted to "/api" in apps/web/Dockerfile).
# "shelf-api" is the api service's container_name (docker-compose.yml /
# docker-compose.registry.yml / the prod stack) — plain Docker DNS, not a
# compose network-alias, so it resolves even when compose's automatic
# service-name alias isn't registered (e.g. network_mode: <external network>
# deployments, as in prod).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://shelf-api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker and manifest must never be served stale — an
    # intermediate cache serving an old sw.js is the classic "site never
    # updates" PWA bug. Everything else under dist/assets/ is fine to
    # cache indefinitely since Vite fingerprints those filenames.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # favicon.ico and everything under /icons/ are referenced by fixed,
    # non-fingerprinted paths (unlike Vite's hashed dist/assets/*), so a
    # browser/intermediate cache can keep serving a stale icon
    # indefinitely after a real fix ships on disk — this is exactly what
    # happened with the corrupted favicon.ico fixed in 46b681b. Same
    # "must never be stale" treatment as sw.js/manifest.webmanifest above.
    location ^~ /brand/ {
        add_header Cache-Control "no-cache";
    }

    location ^~ /icons/ {
        add_header Cache-Control "no-cache";
    }
}
