<!doctype html>
<!--
  class="dark" lives here, not just on ProductListPage's own root div, so
  html/body themselves are in dark scope too — see apps/web/src/index.css's
  html/body background rule. This app has no light theme built yet (see
  Product List.md's "Dark theme by default" note), so without this, any
  gap between the real viewport and the app's content box (safe-area
  insets, elastic overscroll, subpixel rounding — mobile Safari does all
  three, Chromium headless doesn't reproduce them the same way) reveals
  globals.css's *light*-theme body background as a thin white line on
  real devices, even though it never showed up in local screenshots.
-->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShelfSense</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
