<!doctype html>
<!--
  class="dark" here is the pre-JS default — kept for the same reason as
  before (see apps/web/src/index.css's html background rule): a gap
  between the real viewport and the app's content box on real mobile
  Safari reveals globals.css's *light*-theme body background as a thin
  white line unless html itself carries the theme class, not just some
  inner wrapper. The inline script below corrects this to "light" before
  first paint if that's the stored preference (see src/lib/theme.ts) — the
  runtime toggle only ever touches <html> too, never a React-rendered
  wrapper, so this fallback and the toggle can't drift out of sync.

  lang="en" below is only the pre-JS placeholder — unlike the theme class
  above, a stale lang has no paint-flash consequence (only an
  accessibility-timing one), so there's no equivalent inline script here.
  AppLocaleProvider (src/lib/AppLocaleProvider.tsx) corrects it
  synchronously, before paint, via a layout effect — see specs/i18n.md.
-->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/brand/favicon.ico" />
    <title>ShelfSense</title>

    <!-- PWA / add-to-home-screen. vite-plugin-pwa injects the
         manifest.webmanifest link and registers the service worker itself
         (see vite.config.ts) — everything here is what it doesn't cover:
         Android's install-prompt theming, and iOS's Safari-specific tags,
         since Safari never reads the manifest for any of this. -->
    <meta name="theme-color" content="#167d76" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShelfSense" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      (function () {
        if (localStorage.getItem("ss-theme") === "light") {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
