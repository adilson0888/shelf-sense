# Local example: runs the images already published by CI (see
# .github/workflows/docker-build.yml) instead of building from source —
# use this once a push to main has run the pipeline at least once.
#
# The packages are private (same visibility as this repo), so pulling
# requires logging in first:
#   echo <a GitHub PAT with read:packages scope> | docker login ghcr.io -u <your-github-username> --password-stdin
#
# Usage:
#   docker compose -f docker-compose.registry.yml up -d
#   api  -> http://localhost:3001/health
#   web  -> http://localhost:8080
#
# To pick up a newer push instead of whatever was last pulled:
#   docker compose -f docker-compose.registry.yml pull
#   docker compose -f docker-compose.registry.yml up -d
#
# db's credentials below are the frictionless-by-default local values —
# override via a .env file next to this one for anything beyond
# local/single-user self-hosting. See specs/Persistence.md.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shelfsense}
      POSTGRES_USER: ${POSTGRES_USER:-shelf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shelf}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: ghcr.io/adilson0888/shelf-sense-api:latest
    # Fixed name (matches prod) so apps/web/nginx.conf's /api/ proxy_pass
    # can find it by hostname regardless of compose's own service-alias
    # behavior — see apps/web/nginx.conf.
    container_name: shelf-api
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      # Discrete vars, not DATABASE_URL — see specs/Database Configuration.md.
      # "db" (not localhost) is the db service's compose-network hostname.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-shelfsense}
      DB_USER: ${POSTGRES_USER:-shelf}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-shelf}
    depends_on:
      - db
    restart: unless-stopped

  web:
    image: ghcr.io/adilson0888/shelf-sense-web:latest
    container_name: shelf-web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
