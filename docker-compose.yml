# Local example: builds and runs both images from source (same Dockerfiles
# the CI pipeline uses — see .github/workflows/docker-build.yml) and wires
# them together on one network. Not used by CI; this is for running the
# stack locally without pulling from GHCR.
#
# Usage:
#   docker compose up --build
#   api  -> http://localhost:3001/health
#   web  -> http://localhost:8080
#
# db's credentials below are the frictionless-by-default local values —
# override via a .env file next to this one (docker compose reads it
# automatically) for anything beyond local/single-user self-hosting. See
# specs/Persistence.md for why Postgres + auto-migrate-on-boot, not SQLite
# or a manual migration step.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shelfsense}
      POSTGRES_USER: ${POSTGRES_USER:-shelf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shelf}
    # Published to the host so `npm run dev -w shelf-sense-api` (outside
    # Docker) can reach it at localhost:5432 — see apps/api/.env.example.
    # api itself talks to it over the compose network via the "db" hostname
    # regardless of this mapping.
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Fixed name (matches prod) so apps/web/nginx.conf's /api/ proxy_pass
    # can find it by hostname regardless of compose's own service-alias
    # behavior — see apps/web/nginx.conf.
    container_name: shelf-api
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      # Discrete vars, not DATABASE_URL — see specs/Database Configuration.md.
      # "db" (not localhost) is the db service's compose-network hostname.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-shelfsense}
      DB_USER: ${POSTGRES_USER:-shelf}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-shelf}
    depends_on:
      - db
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: shelf-web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
